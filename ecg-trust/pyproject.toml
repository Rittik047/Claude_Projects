[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecgtrust"
version = "0.1.0"
description = "Trustworthy 12-lead ECG classification on PTB-XL: calibration, conformal abstention, subgroup, robustness and external validation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rittik Patra" }]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "wfdb>=4.1",
  "torch>=2.5",
  "pyyaml>=6",
  "matplotlib>=3.8",
  "joblib>=1.3",
  "jinja2>=3.1",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "streamlit>=1.35"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
ecgtrust = "ecgtrust.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["network: requires internet access (skipped in CI)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ecgtrust"]

[tool.setuptools.package-data]
ecgtrust = ["guide/template.html", "guide/render_pdf.js"]
